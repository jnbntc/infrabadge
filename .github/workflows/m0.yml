name: InfraBadge M0

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Pull pinned development image
        run: docker pull ghcr.io/jnbntc/iot-dev@sha256:1856a24089587f0d2d57801ba1bc65a008cd36c751a92118c3e308b23ab4ebb2
      - name: Native tests and three ESP32-S3 profiles, offline without hardware
        run: |
          docker run --rm --network none --cap-drop all --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" --env HOME=/tmp/infrabadge-home --env IB_SANITIZE=1 \
            --volume "$PWD:/project" --workdir /project \
            ghcr.io/jnbntc/iot-dev@sha256:1856a24089587f0d2d57801ba1bc65a008cd36c751a92118c3e308b23ab4ebb2 \
            bash -c 'mkdir -p "$HOME"; exec /usr/local/bin/idf-env bash tools/build.sh --inside all'
      - name: Build logs and verification manifests
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m0-build-results
          path: results/m0-build-*/
          if-no-files-found: ignore
