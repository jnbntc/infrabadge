name: InfraBadge M0 to M3

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Pull pinned development image
        run: docker pull ghcr.io/jnbntc/iot-dev@sha256:1856a24089587f0d2d57801ba1bc65a008cd36c751a92118c3e308b23ab4ebb2
      - name: Native/visual tests and seven firmware profiles, offline without hardware
        run: |
          docker run --rm --network none --cap-drop all --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" --env HOME=/tmp/infrabadge-home --env IB_SANITIZE=1 \
            --volume "$PWD:/project" --workdir /project \
            ghcr.io/jnbntc/iot-dev@sha256:1856a24089587f0d2d57801ba1bc65a008cd36c751a92118c3e308b23ab4ebb2 \
            bash -c 'mkdir -p "$HOME"; exec /usr/local/bin/idf-env bash tools/build-m2-auto.sh --inside --all'
      - name: Build logs and verification manifests
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m0-m1-m11-m2-build-results
          path: |
            results/m0-build-*/
            results/m1-build-*/
            results/m11-build-*/
            results/m2-build-*/
            results/m2-auto-build-*/
          if-no-files-found: ignore

  gateway:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Isolated locked Python dependencies
        run: |
          python3 -m venv /tmp/infrabadge-gateway
          /tmp/infrabadge-gateway/bin/python -m pip install --require-hashes -r gateway/requirements.lock
          /tmp/infrabadge-gateway/bin/python -m pip install --require-hashes -r tools/m3/style.lock
      - name: Collector, gateway, integration and protocol regression (deterministic fixtures)
        run: |
          /tmp/infrabadge-gateway/bin/python tools/m2/generate_protocol.py --check
          /tmp/infrabadge-gateway/bin/python tools/m3/generate_fixtures.py --check
          /tmp/infrabadge-gateway/bin/python -m pytest -c pytest.ini
          PATH="/tmp/infrabadge-gateway/bin:$PATH" bash tools/m3/check_style.sh
          /tmp/infrabadge-gateway/bin/python tools/m3/build_collector.py --output /tmp/infrabadge-collector.pyz
          /tmp/infrabadge-gateway/bin/python -I /tmp/infrabadge-collector.pyz --help
          systemd-analyze verify deploy/m3/infrabadge-collector.service deploy/m3/infrabadge-collector.timer
